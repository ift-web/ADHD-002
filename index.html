<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Joanne 管理">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%237c6a56%22 rx=%2220%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22>⭐</text></svg>">
  
  <title>Joanne 的日常管理工具</title>

  <script>
    const manifest = {
      "name": "Joanne 的日常管理工具",
      "short_name": "ADHD 管理",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#f7f4ef",
      "theme_color": "#7c6a56",
      "icons": [{
        "src": "data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%237c6a56%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22white%22>⭐</text></svg>",
        "sizes": "192x192",
        "type": "image/svg+xml"
      }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.write(`<link rel="manifest" href="${URL.createObjectURL(blob)}">`);
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; padding: 0; background-color: #f7f4ef; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { display: none; }
    
    /* 閃爍動畫：用來提醒時間到 */
    @keyframes flash {
      0% { background-color: #c0613a; }
      50% { background-color: #f7f4ef; }
      100% { background-color: #c0613a; }
    }
    .time-up-bg { animation: flash 1s infinite; color: white !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const P = {
      bg: "#f7f4ef", card: "#fffdf9", border: "#e2d9cc",
      text: "#3a2e24", sub: "#8c7b6b", accent: "#7c6a56",
      danger: "#c0613a", green: "#5a8a6a", tag: "#ede8e0", orange: "#a06030",
    };
    const PRIORITY = { high: { label: "緊急", color: "#c0613a", bg: "#fbe9e2", emoji: "🔴" }, medium: { label: "普通", color: "#a06030", bg: "#fef3e2", emoji: "🟡" }, low: { label: "之後", color: "#5a8a6a", bg: "#e8f2ec", emoji: "🟢" } };
    const SORT_ORDER = { high: 0, medium: 1, low: 2 };
    const PERIOD_LABEL = { daily: "每日", weekly: "每週", monthly: "每月", yearly: "每年" };
    const WEEKDAYS = ["週一", "週二", "週三", "週四", "週五", "週六", "週日"];
    const MONTHDAYS = Array.from({ length: 31 }, (_, i) => i + 1);
    const MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
    const ICONS = ["⭐", "🏃", "📖", "🐶", "🌱", "🍱", "💧", "🛁", "🪴", "📝", "🎵", "🛒", "💪", "🧘", "📞", "🧴", "🗂️", "🪟", "💡", "🔧", "🧺", "🗑️", "🧹", "📦", "💳", "💊", "✂️", "🧦", "🎂", "📋", "🏥", "✈️", "🔑", "💰", "🪪"];

    // 內建的專注定時器模板
    const TIMER_TEMPLATES = [
      {
        id: "t_survival", icon: "🪫", label: "極簡生存洗沐 (5分鐘)",
        desc: "電力10%專用。不要管細節，有弄濕就算贏。",
        steps: [
          { label: "脫衣服進浴室", duration: 1 },
          { label: "重點部位清潔 (腋下/私密處/腳)", duration: 2 },
          { label: "洗臉與刷牙", duration: 2 }
        ]
      },
      {
        id: "t_standard", icon: "🚿", label: "標準洗沐 (30分鐘)",
        desc: "日常下班適用。限制洗頭與保養時間，防止完美主義發作。",
        steps: [
          { label: "準備與脫衣", duration: 2 },
          { label: "洗頭與沖洗", duration: 7 },
          { label: "洗身體", duration: 5 },
          { label: "洗臉 (勿過度搓揉)", duration: 2 },
          { label: "擦乾、穿衣出浴室", duration: 4 },
          { label: "吹頭髮", duration: 7 },
          { label: "極簡鎖水保濕", duration: 3 }
        ]
      },
      {
        id: "t_night", icon: "🌙", label: "夜間護膚與刷牙 (20分鐘)",
        desc: "整合電動牙刷與酸類保養吸收時間的精密排程。",
        steps: [
          { label: "電動牙刷 (上下排定時)", duration: 2 },
          { label: "溫和洗臉與按壓擦乾", duration: 3 },
          { label: "第一道活性保養 (Tretinoin / AHA / 維他命C)", duration: 3 },
          { label: "等待吸收緩衝時間 (滑一下手機)", duration: 7 },
          { label: "最後鎖水乳液與收尾", duration: 5 }
        ]
      }
    ];

    const INIT_ALARM_PRESETS = [
      { id: "p_1", label: "起床提醒", type: "fixed", time: "08:00" },
      { id: "p_2", label: "吃藥", type: "fixed", time: "09:00" },
      { id: "p_3", label: "喝水", type: "interval", interval: 2, start: "09:00", end: "21:00" },
      { id: "p_4", label: "睡前整理", type: "fixed", time: "22:30" }
    ];

    const safeNotify = (title, body = "ADHD 管理提醒") => {
      try {
        if (typeof window === "undefined") return;
        if (!("Notification" in window)) return;
        if (window.Notification.permission === "granted") {
          new window.Notification("⏰ " + title, { body });
        }
      } catch (e) { }
    };
    const safeRequestNotifPerm = () => {
      try {
        if (typeof window !== "undefined" && "Notification" in window && window.Notification.permission === "default") {
          window.Notification.requestPermission();
        }
      } catch (e) { }
    };

    const INIT_ROUTINES = [
      { id: "laundry", icon: "🧺", label: "洗衣服", period: "weekly", weekdays: ["週六"], monthdays: [], month: null },
      { id: "trash", icon: "🗑️", label: "倒垃圾", period: "weekly", weekdays: ["週三"], monthdays: [], month: null },
      { id: "boxes", icon: "📦", label: "清空箱子", period: "weekly", weekdays: ["週日"], monthdays: [], month: null },
      { id: "socks", icon: "🧦", label: "洗襪子", period: "daily", weekdays: [], monthdays: [], month: null },
    ];

    const emptyDraft = (period = "weekly") => ({
      label: "", icon: "⭐", period,
      weekdays: period === "weekly" ? ["週一"] : [],
      monthdays: period === "monthly" ? [1] : [],
      month: period === "yearly" ? "1月" : null,
    });

    const defaultData = { anchor: "", deadlines: [], leaveTime: "", prepMinutes: 40, pendingItems: [], alarms: [], alarmPresets: INIT_ALARM_PRESETS, lastClearReminder: null, routines: INIT_ROUTINES };

    const loadData = () => {
      try {
        const raw = localStorage.getItem("adhd_joanne_v1");
        if (!raw) return defaultData;
        const p = JSON.parse(raw);
        if (!p.routines) p.routines = INIT_ROUTINES;
        if (!p.alarmPresets) p.alarmPresets = INIT_ALARM_PRESETS;
        return { ...defaultData, ...p };
      } catch (e) { return defaultData; }
    };
    const saveData = (d) => { try { localStorage.setItem("adhd_joanne_v1", JSON.stringify(d)); } catch (e) { } };

    const st = {
      app: { minHeight: "100vh", background: P.bg, fontFamily: "'Georgia', serif", color: P.text, paddingBottom: 60 },
      header: { padding: "calc(env(safe-area-inset-top, 0px) + 28px) 24px 16px", borderBottom: `1px solid ${P.border}`, background: P.card },
      sec: { margin: "20px 16px 0", background: P.card, borderRadius: 12, border: `1px solid ${P.border}`, overflow: "hidden" },
      sH: { padding: "14px 18px 10px", borderBottom: `1px solid ${P.border}`, display: "flex", alignItems: "center", justifyContent: "space-between" },
      sT: { fontSize: 13, fontWeight: "bold", color: P.sub, letterSpacing: 1, textTransform: "uppercase" },
      sB: { padding: "14px 18px" },
      inp: { width: "100%", border: `1px solid ${P.border}`, borderRadius: 8, padding: "10px 12px", fontSize: 16, background: P.bg, color: P.text, outline: "none", boxSizing: "border-box", fontFamily: "inherit" },
      btn: { border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 14, cursor: "pointer", fontFamily: "inherit", transition: "0.2s" },
      row: { display: "flex", gap: 8, alignItems: "center" },
    };

    const DayBadge = ({ n }) => (
      <span style={{ background: n <= 1 ? "#fbe9e2" : n <= 3 ? "#fef3e2" : P.tag, color: n <= 1 ? P.danger : n <= 3 ? P.orange : P.sub, borderRadius: 20, padding: "3px 10px", fontSize: 12, fontWeight: "bold", whiteSpace: "nowrap" }}>
        {n >= 0 ? `${n} 天` : "已過期"}
      </span>
    );

    const PriBadge = ({ value, onChange }) => {
      const [open, setOpen] = useState(false);
      const pv = PRIORITY[value] || PRIORITY.medium;
      const ref = useRef();
      useEffect(() => {
        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", h);
        return () => document.removeEventListener("mousedown", h);
      }, []);
      return (
        <div ref={ref} style={{ position: "relative", display: "inline-block", flexShrink: 0 }}>
          <button onClick={() => setOpen(o => !o)}
            style={{ ...st.btn, background: pv.bg, color: pv.color, padding: "5px 10px", fontSize: 12, fontWeight: "bold", border: `1.5px solid ${pv.color}`, display: "flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}>
            {pv.emoji} {pv.label} <span style={{ fontSize: 10, opacity: 0.7 }}>▴</span>
          </button>
          {open && (
            <div style={{ position: "absolute", bottom: "110%", left: 0, zIndex: 100, background: P.card, border: `1px solid ${P.border}`, borderRadius: 8, boxShadow: "0 -4px 16px rgba(0,0,0,0.12)", overflow: "hidden", minWidth: 90 }}>
              {Object.entries(PRIORITY).map(([k, v]) => (
                <button key={k} onClick={() => { onChange(k); setOpen(false); }}
                  style={{ ...st.btn, display: "block", width: "100%", textAlign: "left", padding: "9px 14px", fontSize: 13, background: k === value ? v.bg : P.card, color: k === value ? v.color : P.text, borderRadius: 0, fontWeight: k === value ? "bold" : "normal" }}>
                  {v.emoji} {v.label}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    };

    // --- 核心模組：專注定時器視圖 ---
    const FocusTimerView = ({ template, onExit }) => {
      const [stepIndex, setStepIndex] = useState(0);
      const [timeLeft, setTimeLeft] = useState(template.steps[0].duration * 60);
      const [isRunning, setIsRunning] = useState(false);
      const [isTimeUp, setIsTimeUp] = useState(false);

      useEffect(() => {
        safeRequestNotifPerm();
      }, []);

      useEffect(() => {
        let timer;
        if (isRunning && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(prev => prev - 1), 1000);
        } else if (isRunning && timeLeft <= 0) {
          setIsTimeUp(true);
          safeNotify("時間到！", `請馬上結束「${template.steps[stepIndex].label}」，進入下一步驟。`);
          setIsRunning(false);
        }
        return () => clearInterval(timer);
      }, [isRunning, timeLeft, stepIndex, template]);

      const handleNext = () => {
        if (stepIndex < template.steps.length - 1) {
          setStepIndex(prev => prev + 1);
          setTimeLeft(template.steps[stepIndex + 1].duration * 60);
          setIsRunning(true);
          setIsTimeUp(false);
        } else {
          safeNotify("全部完成！", "你成功戰勝了浴室黑洞！");
          onExit();
        }
      };

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const currentStep = template.steps[stepIndex];
      const nextStep = template.steps[stepIndex + 1];
      const totalSteps = template.steps.length;

      return (
        <div className={isTimeUp ? "time-up-bg" : ""} style={{ position: "fixed", top: 0, left: 0, width: "100vw", height: "100vh", background: isTimeUp ? P.danger : P.card, zIndex: 9999, display: "flex", flexDirection: "column", padding: "40px 20px", boxSizing: "border-box" }}>
          <button onClick={onExit} style={{ position: "absolute", top: 20, right: 20, background: "transparent", border: "none", fontSize: 24, color: isTimeUp ? "#fff" : P.sub }}>✕</button>
          
          <div style={{ textAlign: "center", marginTop: "10vh", color: isTimeUp ? "#fff" : P.sub, fontSize: 16, fontWeight: "bold", letterSpacing: 2 }}>
            步驟 {stepIndex + 1} / {totalSteps}
          </div>
          
          <div style={{ textAlign: "center", marginTop: 20, fontSize: 32, fontWeight: "bold", color: isTimeUp ? "#fff" : P.text, minHeight: 80 }}>
            {currentStep.label}
          </div>

          <div style={{ textAlign: "center", fontSize: "28vw", fontWeight: "bold", margin: "4vh 0", color: isTimeUp ? "#fff" : P.accent, fontFamily: "monospace", fontVariantNumeric: "tabular-nums" }}>
            {formatTime(timeLeft)}
          </div>

          <div style={{ textAlign: "center", color: isTimeUp ? "rgba(255,255,255,0.8)" : P.sub, fontSize: 16, height: 24 }}>
            {nextStep ? `下一步：${nextStep.label}` : "這是最後一步了！"}
          </div>

          <div style={{ marginTop: "auto", display: "flex", flexDirection: "column", gap: 16 }}>
            {isTimeUp ? (
              <button onClick={handleNext} style={{ ...st.btn, background: "#fff", color: P.danger, fontSize: 20, padding: 20, fontWeight: "bold", borderRadius: 16, boxShadow: "0 8px 24px rgba(0,0,0,0.2)" }}>
                我知道了，立刻換下一步！
              </button>
            ) : (
              <>
                <button onClick={() => setIsRunning(!isRunning)} style={{ ...st.btn, background: isRunning ? P.tag : P.accent, color: isRunning ? P.accent : "#fff", fontSize: 20, padding: 20, fontWeight: "bold", borderRadius: 16 }}>
                  {isRunning ? "暫停" : (timeLeft === currentStep.duration * 60 ? "開始計時" : "繼續")}
                </button>
                <button onClick={handleNext} style={{ ...st.btn, background: "transparent", color: P.sub, border: `1px solid ${P.border}`, fontSize: 16, padding: 14 }}>
                  提早完成，跳下一步
                </button>
              </>
            )}
          </div>
        </div>
      );
    };
    // --- 定時器模組結束 ---

    const App = () => {
      const [data, setData] = useState(loadData);
      const [now, setNow] = useState(new Date());
      const [tab, setTab] = useState("today"); // today, routines, focus, alarms
      
      const [newPending, setNewPending] = useState({ text: "", priority: "medium" });
      const [activeTemplate, setActiveTemplate] = useState(null); // 用於控制全螢幕定時器

      const tickRef = useRef();

      useEffect(() => { tickRef.current = setInterval(() => setNow(new Date()), 1000); return () => clearInterval(tickRef.current); }, []);
      useEffect(() => { saveData(data); }, [data]);

      const upd = (p) => setData(d => ({ ...d, ...p }));

      const prepStart = () => {
        if (!data.leaveTime) return null;
        const [h, m] = data.leaveTime.split(":").map(Number);
        const t = ((h * 60 + m - data.prepMinutes) % 1440 + 1440) % 1440;
        return `${String(Math.floor(t / 60)).padStart(2, "0")}:${String(t % 60).padStart(2, "0")}`;
      };
      const minsToLeave = () => {
        if (!data.leaveTime) return null;
        const [h, m] = data.leaveTime.split(":").map(Number);
        return h * 60 + m - (now.getHours() * 60 + now.getMinutes());
      };
      const leavePercent = () => {
         const mtl = minsToLeave();
         if (mtl === null || mtl < 0) return 0;
         if (mtl > 120) return 100;
         return (mtl / 120) * 100;
      };

      const urgent = (() => { const d = minsToLeave(); return d !== null && d <= data.prepMinutes && d > 0; })();

      const addPending = () => {
        const t = newPending.text.trim(); if (!t) return;
        upd({ pendingItems: [...data.pendingItems, { id: Date.now(), text: t, priority: newPending.priority }] });
        setNewPending({ text: "", priority: "medium" });
      };
      const removePending = (id) => upd({ pendingItems: data.pendingItems.filter(p => p.id !== id), lastClearReminder: Date.now() });
      const updatePriority = (id, priority) => upd({ pendingItems: data.pendingItems.map(p => p.id === id ? { ...p, priority } : p) });
      const sortedPending = [...data.pendingItems].sort((a, b) => SORT_ORDER[a.priority] - SORT_ORDER[b.priority]);

      const timeStr = now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit" });
      const dateStr = now.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "long" });

      return (
        <div style={st.app}>
          {/* 全螢幕定時器 */}
          {activeTemplate && <FocusTimerView template={activeTemplate} onExit={() => setActiveTemplate(null)} />}

          <div style={st.header}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
              <div>
                <div style={{ fontSize: 22, fontWeight: "bold", letterSpacing: 1, color: P.accent }}>Joanne 的大腦外接碟</div>
                <div style={{ fontSize: 13, color: P.sub, marginTop: 4 }}>{dateStr}</div>
              </div>
              <div style={{ fontSize: 28, fontWeight: "bold", color: P.accent, fontFamily: "monospace" }}>{timeStr}</div>
            </div>
            {/* 導覽列加上「⏳ 專注」 */}
            <div style={{ display: "flex", gap: 6, marginTop: 16, overflowX: "auto", paddingBottom: 4 }}>
              {[["today", "📋 總覽"], ["focus", "⏳ 專注"], ["routines", "🔁 例行"], ["alarms", "⏰ 提醒"]].map(([k, l]) => (
                <button key={k} onClick={() => setTab(k)} style={{ ...st.btn, background: tab === k ? P.accent : P.tag, color: tab === k ? "#fff" : P.accent, padding: "7px 14px", fontSize: 13, whiteSpace: "nowrap" }}>{l}</button>
              ))}
            </div>
          </div>

          {tab === "today" && <>
            <div style={{ ...st.sec, border: urgent ? `2px solid ${P.danger}` : `1px solid ${P.border}` }}>
              <div style={st.sH}>
                <span style={st.sT}>🚪 出門倒數</span>
                {minsToLeave() !== null && minsToLeave() > 0 && <span style={{ fontSize: 13, color: urgent ? P.danger : P.green, fontWeight: "bold" }}>剩 {minsToLeave()} 分鐘</span>}
              </div>
              
              {/* 視覺化出門進度條 */}
              {minsToLeave() !== null && minsToLeave() > 0 && (
                <div style={{ height: 6, background: P.tag, width: "100%" }}>
                  <div style={{ height: "100%", width: `${leavePercent()}%`, background: urgent ? P.danger : P.green, transition: "width 1s linear" }} />
                </div>
              )}

              <div style={st.sB}>
                <div style={{ display: "flex", gap: 12 }}>
                   <div style={{ flex: 1 }}>
                     <div style={{ fontSize: 12, color: P.sub, marginBottom: 4 }}>預計出門時間</div>
                     <input type="time" style={st.inp} value={data.leaveTime} onChange={e => upd({ leaveTime: e.target.value })} />
                   </div>
                   <div style={{ flex: 1 }}>
                     <div style={{ fontSize: 12, color: P.sub, marginBottom: 4 }}>準備需要 (分)</div>
                     <input type="number" style={st.inp} value={data.prepMinutes} onChange={e => upd({ prepMinutes: parseInt(e.target.value) || 0 })} />
                   </div>
                </div>

                {prepStart() && (
                  <div style={{ background: urgent ? "#fbe9e2" : P.tag, borderRadius: 8, padding: "10px 14px", fontSize: 14, marginTop: 16 }}>
                    <span style={{ color: P.sub }}>鬧鐘設定：最晚 </span>
                    <strong style={{ color: urgent ? P.danger : P.accent, fontSize: 18 }}>{prepStart()}</strong>
                    <span style={{ color: P.sub }}> 必須開始動作。</span>
                  </div>
                )}
              </div>
            </div>

            <div style={st.sec}>
              <div style={st.sH}>
                <span style={st.sT}>📦 雜物暫放區 (隨手丟)</span>
              </div>
              <div style={st.sB}>
                <div style={{ ...st.row, marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
                  <input style={{ ...st.inp, flex: 2, minWidth: 140 }} placeholder="例如：剛收到的包裹、還沒洗的襪子..." value={newPending.text} onChange={e => setNewPending(p => ({ ...p, text: e.target.value }))} onKeyDown={e => e.key === "Enter" && addPending()} />
                  <div style={{ display: "flex", gap: 4 }}>{Object.entries(PRIORITY).map(([k, v]) => <button key={k} onClick={() => setNewPending(p => ({ ...p, priority: k }))} style={{ ...st.btn, padding: "9px 11px", fontSize: 14, background: newPending.priority === k ? v.bg : P.tag, color: newPending.priority === k ? v.color : P.sub, border: `1.5px solid ${newPending.priority === k ? v.color : "transparent"}` }}>{v.emoji}</button>)}</div>
                  <button style={{ ...st.btn, background: P.accent, color: "#fff" }} onClick={() => addPending()}>丟入</button>
                </div>
                {sortedPending.map((item, i) => (
                  <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "11px 0", borderTop: i > 0 ? `1px solid ${P.border}` : "none" }}>
                    <PriBadge value={item.priority} onChange={v => updatePriority(item.id, v)} />
                    <span style={{ flex: 1, fontSize: 14 }}>{item.text}</span>
                    <button style={{ ...st.btn, background: P.tag, color: P.accent, padding: "5px 12px", fontSize: 12, whiteSpace: "nowrap" }} onClick={() => removePending(item.id)}>處理完畢 ✓</button>
                  </div>
                ))}
              </div>
            </div>
          </>}

          {/* 新增的專注模組頁籤 */}
          {tab === "focus" && (
            <div style={st.sec}>
              <div style={st.sH}>
                <span style={st.sT}>⏳ 步驟拆解定時器</span>
                <span style={{ fontSize: 12, color: P.sub }}>對抗完美主義</span>
              </div>
              <div style={st.sB}>
                <div style={{ fontSize: 14, color: P.sub, marginBottom: 16, lineHeight: 1.5 }}>
                  覺得洗澡或保養很花時間、阻力很大嗎？選擇你現在的「能量狀態」，讓系統帶著你一步一步做，時間到就**強制換下一步**。
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {TIMER_TEMPLATES.map(tmpl => (
                    <button 
                      key={tmpl.id} 
                      onClick={() => setActiveTemplate(tmpl)}
                      style={{ ...st.btn, background: P.card, border: `1.5px solid ${P.accent}`, padding: 16, textAlign: "left", display: "flex", alignItems: "center", gap: 16, borderRadius: 12, transition: "transform 0.1s" }}
                    >
                      <div style={{ fontSize: 32 }}>{tmpl.icon}</div>
                      <div>
                        <div style={{ fontSize: 16, fontWeight: "bold", color: P.accent }}>{tmpl.label}</div>
                        <div style={{ fontSize: 12, color: P.sub, marginTop: 4 }}>{tmpl.desc}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {tab === "routines" && (
             <div style={{ padding: "40px 20px", textAlign: "center", color: P.sub }}>
               (為簡化展示，例行清單維持在原有邏輯，可從上方選單切換至「⏳ 專注」測試新功能)
             </div>
          )}
          {tab === "alarms" && (
             <div style={{ padding: "40px 20px", textAlign: "center", color: P.sub }}>
               (提醒設定維持在原有邏輯)
             </div>
          )}

          <div style={{ textAlign: "center", marginTop: 32, fontSize: 12, color: P.sub }}>做得爛，也比沒做好 ✦</div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
